[dependency-groups]
runtime = [
    "aiohttp",
    "apscheduler",
    "docker",
    "fastapi",
    "pydantic",
    "pyyaml",
    "starlette",
    "uvicorn",
    "yarl",
]
typecheck = [
    { include-group = "runtime" },
    "httpx",
    "pytest",
    "types-cffi",
    "types-docker",
    "types-PyMySQL",
    "types-pyRFC3339",
    "types-python-dateutil",
    "types-PySocks",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
]
lint = [
    { include-group = "typecheck" },
    "mypy",
    "prek",
    "ruff",
]
test = [
    { include-group = "runtime" },
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.codespell]
skip = "*.py,*.toml,*.json"
quiet-level = 3

[tool.pytest.ini_options]
addopts = """
  --quiet
  --timeout=20
  --durations=10
  -o console_output_style=progress
  --cov=backend
  --cov-report=term-missing
  --cov-report=html:coverage/backend/html
  --cov-report=json:coverage/backend/coverage-summary.json
  --cov-report=xml:coverage/backend/coverage.xml
"""
testpaths = ["tests/backend"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "integration: public API tests spanning multiple backend modules",
    "workflow: end-to-end user workflow tests through the ASGI boundary",
]

[tool.coverage.run]
branch = true
data_file = "coverage/backend/.coverage"
relative_files = true
parallel = false

[tool.coverage.report]
show_missing = true
# Ratchet, not a target. Set just below the measured total so an unrelated
# change cannot quietly reduce coverage; raise it when coverage rises. Several
# defects found in review sat in modules that had no tests at all, so the floor
# exists to stop that surface growing rather than to certify the current number.
fail_under = 40

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.mypy]
python_version = "3.13"
platform = "linux"
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["deprecated", "ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked"]
extra_checks = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = false
warn_unreachable = false

[tool.ruff]
line-length = 100
fix = true
force-exclude = true
target-version = "py313"
required-version = ">=0.15.0"

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "ASYNC210", # Async functions should not call blocking HTTP methods
    "ASYNC220", # Async functions should not create subprocesses with blocking methods
    "ASYNC221", # Async functions should not run processes with blocking methods
    "ASYNC222", # Async functions should not wait on processes with blocking methods
    "ASYNC230", # Async functions should not open files with blocking methods like open
    "ASYNC251", # Async functions should not call time.sleep
    "B002", # Python does not support the unary prefix increment
    "B005", # Using .strip() with multi-character strings is misleading
    "B007", # Loop control variable {name} not used within loop body
    "B014", # Exception handler with duplicate exception
    "B015", # Pointless comparison. Did you mean to assign a value? Otherwise, prepend assert or remove it.
    "B017", # pytest.raises(BaseException) should be considered evil
    "B018", # Found useless attribute access. Either assign it to a variable or remove it.
    "B023", # Function definition does not bind loop variable {name}
    "B026", # Star-arg unpacking after a keyword argument is strongly discouraged
    "B032", # Possible unintentional type annotation (using :). Did you mean to assign (using =)?
    "B904", # Use raise from to specify exception cause
    "B905", # zip() without an explicit strict= parameter
    "BLE",
    #"C", # complexity
    "C4", # flake8-comprehensions
    "COM818", # Trailing comma on bare tuple prohibited
    "D", # docstrings
    "DTZ", # flake8-datetimez
    "E", # pycodestyle
    "EXE", # flake8-executable
    "F", # pyflakes/autoflake
    "F541", # f-string without any placeholders
    "FA", # flake8-future-annotations
    "FIX", # flake8-fixme
    "FLY", # flynt
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PTH", # flake8-pathlib
    "PYI", # flake8-pyi
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF005", # Consider iterable unpacking instead of concatenation
    "RUF006", # Store a reference to the return value of asyncio.create_task
    "RUF010", # Use explicit conversion flag
    "RUF013", # PEP 484 prohibits implicit Optional
    "RUF017", # Avoid quadratic list summation
    "RUF018", # Avoid assignment expressions in assert statements
    "RUF019", # Unnecessary key check before dictionary access
    "RUF100", # Unused `noqa` directive
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TC", # flake8-type-checking
    "TD", # flake8-todos
    "TID", # Tidy imports
    "TRY", # tryceratops
    "UP", # pyupgrade
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call
    "W", # pycodestyle
    "YTT", # flake8-2020
]

ignore = [
    "D202", # No blank lines allowed after function docstring
    "E501", # line too long

    "PLC1901", # {existing} can be simplified to {replacement} as an empty string is falsey; too many false positives
    "PLR0911", # Too many return statements ({returns} > {max_returns})
    "PLR0912", # Too many branches ({branches} > {max_branches})
    "PLR0913", # Too many arguments to function call ({c_args} > {max_args})
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements ({statements} > {max_statements})
    "PLR0916", # Too many Boolean expressions
    "PLR0917", # Too many positional arguments
    "PLR1702", # Too many nested blocks
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "SIM102", # Use a single if statement instead of nested if statements
    "SIM108", # Use ternary operator {contents} instead of if-else-block

    # Moving imports into type-checking blocks can mess with pytest.patch()
    "TC003", # Move standard library import {} into a type-checking block

    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY300", # Consider moving this statement to an `else` block - overly strict, flags valid patterns
    "TRY400", # Use `logging.exception` instead of `logging.error`

    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",

    # Temporarily
    "D205", # 1 blank line required between summary line and description
    "BLE001", # Blind exception
    "TRY301", # Internal raise
    "PLW0602", # Unused global
    "TRY002", # Create your own exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/backend/**/*.py" = [
    "S101", # Use of assert detected
    "SLF001", # Private member accessed
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

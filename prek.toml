# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[update.repos."https://github.com/biomejs/pre-commit"]
include_tags = ["v2.*"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = '.*\.md$'

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = '.*\.md$'

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "detect-private-key"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "uv run shellcheck"
language = "system"
args = ["-x"]
types = ["shell"]
require_serial = true

[[repos.hooks]]
id = "codespell"
name = "codespell"
entry = "uv run codespell"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run mypy"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --force-exclude"
language = "system"
args = ["--fix"]
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "tsc"
name = "tsc check"
entry = "npm --prefix frontend run tsc"
language = "system"
files = "^(frontend|scripts)/"
types_or = ["ts", "tsx", "javascript", "json", "jsx"]
pass_filenames = false

[[repos.hooks]]
id = "frontend-build"
name = "frontend build"
entry = "npm --prefix frontend run build"
language = "system"
files = "^frontend/"
pass_filenames = false

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.7"

[[repos.hooks]]
id = "biome-check"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "musl-wheels-x86_64"
name = "musl wheels for x86_64"
entry = "uv sync --locked --no-dev --no-install-project --no-build --python-platform x86_64-unknown-linux-musl --dry-run"
language = "system"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "musl-wheels-aarch64"
name = "musl wheels for aarch64"
entry = "uv sync --locked --no-dev --no-install-project --no-build --python-platform aarch64-unknown-linux-musl --dry-run"
language = "system"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

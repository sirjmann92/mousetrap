version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Bumps the exact versions in requirements/constraints.txt, which every
  # Python install in this repository uses. Grouped into one weekly pull
  # request so a batch of releases is reviewed and tested together; security
  # updates still arrive on their own as soon as an advisory is published.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python:
        applies-to: version-updates
        patterns:
          - "*"
    # Dependabot bumps each pin on its own and does not check it against the
    # other pins' requirements, so it can move a dependency past the range its
    # parent accepts. Each entry below is one of those, held until the parent
    # accepts the new version; scripts/update-dependencies.sh re-resolves
    # everything together and picks it up then, so delete the entry at that
    # point.
    ignore:
      # aiohttp 3.14.3 requires multidict<7.0.
      - dependency-name: "multidict"
        versions: [">=7.0.0"]

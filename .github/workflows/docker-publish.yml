name: Publish Docker image

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Only publish for a push to main whose Tests run actually succeeded.
    # workflow_dispatch remains available as a manual override that bypasses
    # this check, matching its original unconditional behavior. Tests also
    # runs on pull_request; that case is excluded so PR test runs never
    # trigger a publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for GitHub Releases
      packages: write    # needed for GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Read the release version from pyproject.toml
        id: version
        run: |
          VERSION="$(uv version --short)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest,priority=900
            type=sha,prefix=,format=long,priority=200

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # actionlint:ignore
          password: ${{ secrets.DOCKERHUB_TOKEN }} # actionlint:ignore

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Pinned: unset, the action's provenance mode follows repo visibility.
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha
          cache-to: type=gha,mode=max

      # Creates the release (and, as a side effect, the underlying git tag)
      # via the Releases API rather than a raw `git push`. GITHUB_TOKEN can
      # never be granted the `workflows` scope needed to push a ref whose
      # history touches .github/workflows/*, so an explicit `git tag` +
      # `git push` step here fails once any workflow file has changed on
      # main. The Releases API isn't subject to that restriction. This also
      # means the tag only gets created after the image has actually built
      # and pushed successfully, instead of upfront.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

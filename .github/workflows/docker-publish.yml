name: Publish Docker image

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Only publish for a push to main whose Tests run actually succeeded.
    # workflow_dispatch remains available as a manual override that bypasses
    # this check, matching its original unconditional behavior. Tests also
    # runs on pull_request; that case is excluded so PR test runs never
    # trigger a publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for GitHub Releases
      packages: write    # needed for GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # full history needed to read existing tags

      # Auto-bumps the patch version on every publish: X.Y.Z becomes X.Y.(Z+1).
      # To cut a minor or major release instead, include "#minor" or
      # "#major" as a standalone word in any commit message landing since
      # the previous release:
      #   #minor → X.Y.Z becomes X.(Y+1).0   (new feature)
      #   #major → X.Y.Z becomes (X+1).0.0   (breaking change)
      # Written without concrete version numbers so the example cannot go
      # stale as the project releases.
      # Squash merges keep the PR title and the squashed commit bodies, so
      # a contributor can put the keyword in a commit message and a
      # reviewer can add one to the squash message at merge time. A batched
      # release scans every commit since the last tag, so one flagged
      # commit promotes the whole batch.
      - name: Determine next version from tags
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            # Scan commit messages since the last release for a bump keyword.
            # Anchored to word boundaries so an incidental substring cannot
            # promote a release.
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=%B)
            if printf '%s' "$COMMITS" | grep -qiE '(^|[^[:alnum:]_])#major([^[:alnum:]_]|$)'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              echo "Bump keyword found: major"
            elif printf '%s' "$COMMITS" | grep -qiE '(^|[^[:alnum:]_])#minor([^[:alnum:]_]|$)'; then
              MINOR=$((MINOR + 1)); PATCH=0
              echo "Bump keyword found: minor"
            else
              PATCH=$((PATCH + 1))
              echo "No bump keyword found; defaulting to patch"
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            # No tags yet — start at 2.3.6
            NEW_VERSION="2.3.6"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $NEW_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest,priority=900
            type=sha,prefix=,format=long,priority=200

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # actionlint:ignore
          password: ${{ secrets.DOCKERHUB_TOKEN }} # actionlint:ignore

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Pinned: unset, the action's provenance mode follows repo visibility.
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha
          cache-to: type=gha,mode=max

      # Creates the release (and, as a side effect, the underlying git tag)
      # via the Releases API rather than a raw `git push`. GITHUB_TOKEN can
      # never be granted the `workflows` scope needed to push a ref whose
      # history touches .github/workflows/*, so an explicit `git tag` +
      # `git push` step here fails once any workflow file has changed on
      # main. The Releases API isn't subject to that restriction. This also
      # means the tag only gets created after the image has actually built
      # and pushed successfully, instead of upfront.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

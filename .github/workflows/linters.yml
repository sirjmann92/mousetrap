name: Linters

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linters:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3 (with caching)
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install backend Python linting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint

      - name: Cache pre-commit and mypy
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pre-commit
            .mypy_cache
            .ruff_cache
          key: ${{ runner.os }}-lint-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/.pre-commit-config.yaml', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Setup Node.js (for frontend linting)
        uses: actions/setup-node@v7
        with:
          node-version: '22.20.0' # LTS
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
